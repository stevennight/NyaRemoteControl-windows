[package]
name = "nya-app"
description = "NyaRemoteControl for Windows: the program users open (remote control of other computers, management of this one)"
version = "0.10.3"
edition = "2021"
license = "MIT"
publish = false

[[bin]]
name = "NyaRemoteControl"
path = "src/main.rs"

[dependencies]
# Shared crates from the common repository (pinned by COMMON_REF for releases).
nya-proto = { path = "../../common/crates/nya-proto" }
nya-transport = { path = "../../common/crates/nya-transport" }
nya-media = { path = "../../common/crates/nya-media" }
nya-win = { path = "../../common/crates/nya-win" }
nya-ui = { path = "../../common/crates/nya-ui" }
nya-webui = { path = "../../common/crates/nya-webui" }
# This computer as a host: settings, pairing data, control pipe, service install.
# Never the host itself (nya-server): it would load the capture stack here.
nya-server-core = { path = "../core" }

anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
crossbeam-channel = "0.5"
winit = "0.30"
rfd = "0.15"
serde_json = "1"
windows-service = "0.7"
tray-icon = "0.21"
# Pairing links: this computer's addresses and the QR code shown for them.
if-addrs = "0.13"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }

[dependencies.windows]
version = "0.58"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Input_XboxController",
    "Win32_System_LibraryLoader",
    "Win32_System_Console",
    "Win32_System_Threading",
    "Win32_System_Registry",
    "Win32_UI_Shell",
]


[build-dependencies]
winresource = "0.1.31"
