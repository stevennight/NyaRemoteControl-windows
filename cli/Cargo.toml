[package]
name = "nya-server-cli"
description = "NyaRemoteControl host: command line and updater (nya-server.exe)"
version = "0.10.4-beta.5"
edition = "2021"
license = "MIT"
publish = false

# Keep the executable name users know.
[[bin]]
name = "nya-server"
path = "src/main.rs"

[dependencies]
# Never depend on the host (nya-server) or the app: see the workspace manifest.
nya-server-core = { path = "../core" }
nya-win = { path = "../../common/crates/nya-win" }

anyhow = "1"
clap = { version = "4", features = ["derive"] }
toml = "0.8"

[dependencies.windows]
version = "0.58"
features = [
    "Win32_Foundation",
    "Win32_System_Time",
    "Win32_UI_WindowsAndMessaging",
]

[build-dependencies]
winresource = "0.1.31"
