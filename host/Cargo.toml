[package]
name = "nya-server"
description = "NyaRemoteControl host: Windows service, per-session helper and standalone mode (nya-server-svc.exe)"
version = "0.10.1"
edition = "2021"
license = "MIT"
publish = false

[dependencies]
nya-server-core = { path = "../core" }
# Shared crates from the common repository. For CI / releases switch these to
# `git = "<common repo url>", tag = "vX.Y.Z"` and keep a `[patch]` for local work.
nya-proto = { path = "../../common/crates/nya-proto" }
nya-transport = { path = "../../common/crates/nya-transport" }
nya-media = { path = "../../common/crates/nya-media" }
nya-win = { path = "../../common/crates/nya-win" }

anyhow = "1"
tracing = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "process"] }
prost = "0.13"
clap = { version = "4", features = ["derive"] }
crossbeam-channel = "0.5"
windows-service = "0.7"
rand = "0.8"

[dependencies.windows]
version = "0.58"
features = [
    "Win32_Foundation",
    "Win32_Devices_Display",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_RemoteDesktop",
    "Win32_System_Threading",
    "Win32_System_JobObjects",
    "Win32_System_LibraryLoader",
    "Win32_System_SystemInformation",
    "Win32_System_Registry",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Console",
    "Win32_System_Pipes",
    "Win32_System_StationsAndDesktops",
]

[build-dependencies]
cc = "1"
prost-build = "0.13"
protox = "0.7"
winresource = "0.1.31"
